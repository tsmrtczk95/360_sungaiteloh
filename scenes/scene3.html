<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mukah 360&deg; - Sungai Teloh Jerunei</title>
    <meta name="description" content="360&deg; Image - A-Frame">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="../scripts/portal.js"></script>
    <script src="../scripts/visual_effects.js"></script>
    <script src="../scripts/portal_label.js"></script>
    <script src="../scripts/audio_toggle.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
<!--AUDIO-->  
        <audio id="click-sound" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"></audio>
        <audio id="audioA" src="../audio/jerunaiPlaque.mp3"></audio>
        <audio id="audioB" src="../audio/jerunaiCavity.mp3"></audio>
<!--360 IMAGE & THUMBNAIL -->  
        <img id="skyimg" src="../assets/sgteloh3.jpeg">
        <img id="thumb2" src="../thumbnails/sgteloh2_thumb.jpeg">
        <a-asset-item id="jerunei" src="../assets/jerunei_sg_teloh.glb"></a-asset-item>
      </a-assets>
<!-- 360-degree image. -->
      <a-sky id="image-360" radius="10" src="#skyimg"></a-sky>
      <a-entity class="link"></a-entity>
<!-- Portal return to Scene 2 -->
      <a-sphere position="6 1 -1" radius="0.5" src="#thumb2" page-portal="page: ../scenes/scene2.html" sound="on: click; src: #click-sound"
        portal-glow="color: #00e5ff; intensity: 1.2" portal-label="text: Walkway; offset: 0 0.8 0; textScale: 1.5" 
        animation__hover="property: scale; startEvents: mouseenter; to: 1.2 1.2 1.2; dur: 200"
        animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
      </a-sphere>
<!-- Contents -->
      <a-entity id="audA" sound="src: #audioA; autoplay: false; loop: false; volume: 1"></a-entity>
      <a-entity id="audB" sound="src: #audioB; autoplay: false; loop: false; volume: 1"></a-entity>
      <a-entity position="-5 -0.5 0.5">
        <a-sphere radius="0.1" color="yellow"
          portal-label="text: Metal Plaque; offset: 0 -0.3 0; textScale: 1.4"
          audio-toggle="target: #audA; mode: restart"
          animation__hover="property: scale; startEvents: mouseenter; to: 1.5 1.5 1.5; dur: 400" 
          animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
        </a-sphere>
      </a-entity>
      <a-entity position="-5 8 -1">
        <a-sphere radius="0.1" color="yellow"
          portal-label="text: Carved Cavity; offset: 0 0 -0.8; textScale: 1.4"
          audio-toggle="target: #audB; mode: restart"
          animation__hover="property: scale; startEvents: mouseenter; to: 1.8 1.8 1.8; dur: 400" 
          animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
        </a-sphere>
      </a-entity>
      
      <a-gltf-model src="#jerunei" position="0 0.5 -3"></a-gltf-model>
<!-- Camera + Cursor. -->
      <a-camera wasd-controls-enabled="false" cursor="rayOrigin: mouse" look-controls-enabled>
        <!--a-cursor></a-cursor-->
      </a-camera>
    </a-scene>
  </body>
</html>
