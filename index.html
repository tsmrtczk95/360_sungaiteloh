<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mukah 360&deg; - Jerunei Sungai Teloh Access</title>
    <meta name="description" content="360&deg; Image - A-Frame">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="scripts/portal.js"></script>
    <script src="scripts/visual_effects.js"></script>
    <script src="scripts/portal_label.js"></script>
    <script src="scripts/audio_toggle.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
<!--AUDIO-->  
        <audio id="click-sound" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"></audio>
<!--360 IMAGE & THUMBNAIL -->  
        <img id="skyimg" src="assets/sgteloh1.jpeg">
        <img id="thumb2" src="thumbnails/sgteloh2_thumb.jpeg">
        <img id="thumb3" src="thumbnails/sgteloh3_thumb.jpeg">

        <audio id="audioA" src="audio/welcome_tosapanpuloh.mp3"></audio>
        <audio id="audioB" src="audio/welcome_tosapanpuloh2.mp3"></audio>
      </a-assets>
<!-- 360-degree image. -->
      <a-sky id="image-360" radius="10" src="#skyimg"></a-sky>
      <!-- Link template we will build. -->
      <a-entity class="link"></a-entity>
<!-- Portal from scene 1 to Scene 2 -->
      <a-sphere position="1 0.5 4" radius="0.5" src="#thumb2" page-portal="page: scenes/scene2.html" portal-glow="color: #00e5ff; intensity: 1.2"
        portal-label="text: Walkway; offset: 0 0.8 0; textScale: 1.5" sound="on: click; src: #click-sound"
        animation__hover="property: scale; startEvents: mouseenter; to: 1.2 1.2 1.2; dur: 200"
        animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
      </a-sphere>
      <!-- Contents -->
      <a-entity id="audA" sound="src: #audioA; autoplay: true; loop: false; volume: 1"></a-entity>
      <a-entity id="audB" sound="src: #audioB; autoplay: false; loop: false; volume: 1; positional: true"></a-entity>
      
      <a-entity position="0 0.1 -3" portal-label="text: Audio; textScale: 1.3">
      <a-sphere position="-0.5 0.5 -3" radius="0.4" color="#ffaa00"
        portal-label="text: Welcome; offset: 0 -0.5 0; textScale: 1.2"
        audio-toggle="target: #audA; mode: restart"
        animation__hover="property: scale; startEvents: mouseenter; to: 0.8 0.8 0.8; dur: 400" 
        animation__leave="property: scale; startEvents: mouseleave; to: 0.3 0.3 0.3; dur: 200">
      </a-sphere>
      <a-sphere position="0.5 0.5 -3" radius="0.4" color="#ffaa00"
        portal-label="text: Welcome 2; offset: 0 -0.5 0; textScale: 1.2"
        audio-toggle="target: #audA; mode: restart"
        animation__hover="property: scale; startEvents: mouseenter; to: 0.8 0.8 0.8; dur: 400" 
        animation__leave="property: scale; startEvents: mouseleave; to: 0.3 0.3 0.3; dur: 200">
      </a-sphere></a-entity>
<!-- Camera + Cursor. -->
      <a-camera wasd-controls-enabled="false" cursor="rayOrigin: mouse">
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
